name: accept-site

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  accept:
    # 只处理带 site-submission 标签的 issue
    if: contains(github.event.issue.labels.*.name, 'site-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析并合并站点
        id: merge
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/merge_site.py

      - name: 提交 sites.json
        if: steps.merge.outputs.added == '1'
        run: |
          git config user.name "mwb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sites.json
          git commit -m "site: add from #${{ github.event.issue.number }}"
          git push

      - name: 回帖并关闭 issue
        uses: actions/github-script@v7
        with:
          script: |
            const added = '${{ steps.merge.outputs.added }}' === '1';
            const reason = '${{ steps.merge.outputs.reason }}';
            const text = added
              ? '已收录，感谢分享。其他人在软件的「导入 → 云端站点库」里填本仓库的 sites.json 地址就能看到。'
              : (reason === 'duplicate' ? '这个站点已经在库里的，跳过。' : '没有解析到有效站点，请检查地址。');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: text,
            });
            if (added || reason === 'duplicate') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }
